<section>
  <h1 class="custom_h1">
    <a routerLink="/" style="text-decoration: none; color: inherit">Wikiwelp</a>
  </h1>
</section>

<section>
  <div>
    <input
      type="text"
      [(ngModel)]="searchQuery"
      (keyup.enter)="executeSearch()"
      placeholder="Cerca..."
    />
    <button type="button" class="custom_button" (click)="executeSearch()">Vai!</button>
    <button type="button" class="custom_button" routerLink="/">Home</button>
  </div>
</section>

<section *ngIf="loading">
  <p>Caricamento...</p>
</section>

<section *ngIf="!loading && searched">
  <!-- Risultati Ricerca per Tag (Lista pagine) -->
  <div *ngIf="isTagSearch">
    <h2>
      Pagine con tag: <i>#{{ searchedQuery }}</i>
    </h2>
    <div *ngIf="tagPages.length > 0">
      <ul style="list-style-type: none; padding: 0">
        <li *ngFor="let p of tagPages" style="margin: 8px 0">
          <a [routerLink]="['/search']" [queryParams]="{ q: p.title }">
            {{ p.title }}
          </a>
        </li>
      </ul>
    </div>
    <div *ngIf="tagPages.length === 0">
      <p>Nessuna pagina trovata con questo tag.</p>
    </div>
  </div>

  <!-- Pagina trovata per titolo -->
  <div *ngIf="!isTagSearch && foundPage">
    <h2>
      {{ foundPage.title }}
      <small
        *ngIf="foundPage.tags && foundPage.tags.length > 0"
        style="margin-left: 6px; font-size: 0.6em; font-weight: normal"
      >
        <span *ngFor="let t of foundPage.tags; let last = last">
          <a
            [routerLink]="['/search']"
            [queryParams]="{ tag: t.name }"
            style="cursor: pointer; text-decoration: underline"
          >
            <i>{{ t.name }}</i>
          </a>
          <span *ngIf="!last">, </span>
        </span>
      </small>
    </h2>
    <div [innerHTML]="selectedRevision ? selectedRevision.content : foundPage.content"></div>

    <!-- Storico Revisioni (Stub) -->
    <div
      *ngIf="foundPage.revisions && foundPage.revisions.length > 1"
      style="margin-top: 15px; font-size: 0.85em; color: gray"
    >
      <!-- Selettore per visionare versioni passate -->
      <div>
        <label for="revSelect">Visualizza versione: </label>
        <select id="revSelect" [(ngModel)]="selectedRevision" style="margin-left: 6px">
          <option [ngValue]="null">
            #{{ foundPage.revisions.length }} ({{
              foundPage.revisions[0].createdAt | date: 'dd/MM/yyyy HH:mm'
            }})
          </option>
          <option *ngFor="let rev of foundPage.revisions.slice(1); let i = index" [ngValue]="rev">
            #{{ foundPage.revisions.length - 1 - i }} ({{
              rev.createdAt | date: 'dd/MM/yyyy HH:mm'
            }})
          </option>
        </select>
      </div>
    </div>

    <div *ngIf="servizio.isLoggedIn()" style="margin-top: 10px">
      <button
        type="button"
        class="custom_button"
        [routerLink]="['/edit']"
        [queryParams]="{ title: foundPage.title }"
      >
        Modifica
      </button>
    </div>
  </div>

  <!-- Pagina non trovata per titolo -->
  <div *ngIf="!isTagSearch && !foundPage">
    <p>
      Nessuna pagina trovata con "<strong>{{ searchedQuery }}</strong
      >".
    </p>

    <!-- Prompt per creare la pagina se loggato -->
    <div *ngIf="servizio.isLoggedIn()">
      <p>Vuoi crearla?</p>
      <button
        type="button"
        class="custom_button"
        [routerLink]="['/edit']"
        [queryParams]="{ title: searchedQuery }"
      >
        Crea pagina
      </button>
    </div>

    <!-- Prompt per login per create la pagina se non loggato -->
    <div *ngIf="!servizio.isLoggedIn()">
      <p>
        <a routerLink="/login">Accedi</a> per creare una nuova pagina con "{{ searchedQuery }}".
      </p>
    </div>
  </div>
</section>
