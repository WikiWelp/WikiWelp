<section>
  <h1 class="custom_h1">
    <a routerLink="/" style="text-decoration: none; color: inherit">Wikiwelp</a>
  </h1>
</section>

<section>
  <h2>Pannello di Controllo Amministratore</h2>
</section>

<div class="admin-container">
  <!-- Sezione Gestione Pagine -->
  <div class="admin-section">
    <h3>Pagine ({{ pages.length }})</h3>
    <p *ngIf="pages.length === 0">Nessuna pagina presente.</p>
    <ul *ngIf="pages.length > 0" class="admin-list">
      <li *ngFor="let p of pages">
        <a [routerLink]="['/search']" [queryParams]="{ q: p.title }">{{ p.title }}</a>
        <button type="button" class="custom_button" (click)="deletePage(p.title)">Elimina</button>
      </li>
    </ul>
  </div>

  <!-- Sezione Gestione Utenti -->
  <div class="admin-section">
    <h3>Utenti ({{ users.length }})</h3>
    <p *ngIf="users.length === 0">Nessun utente presente.</p>
    <ul *ngIf="users.length > 0" class="admin-list">
      <li *ngFor="let u of users">
        <span>
          {{ u.email }}
          <small *ngIf="u.admin"><strong>(Admin)</strong></small>
        </span>
        <button *ngIf="!u.admin" type="button" class="custom_button" (click)="deleteUser(u)">
          Elimina
        </button>
      </li>
    </ul>
  </div>

  <section>
    <button type="button" class="custom_button" routerLink="/">Torna alla Home</button>
  </section>
</div>
