<section>
    <h1>Wikiwelp</h1>
</section>

<section>
    <p *ngIf="servizio.isLoggedIn()">Benvenuto</p>
</section>

<section>
    <img src="images/logo.svg">
</section>

<section>
    <p>Cerca qualunque cosa tu desideri</p>
</section>

<section>
    <div class="search">
        <input type="text" placeholder="Cerca...">
        <button>Vai!</button>
    </div>
</section>

<section>
  <div class="button-row">
    <button *ngIf="!servizio.isLoggedIn()" routerLink="/login">Login</button>
    <button *ngIf="!servizio.isLoggedIn()" routerLink="/register">Registrati</button>

    <button *ngIf="servizio.isLoggedIn()" (click)="logout()">Logout</button>
    <button *ngIf="servizio.isLoggedIn()">Crea</button>

  </div>
</section>
