<section>
    <h1 class="custom_h1">Wikiwelp</h1>
</section>

<section>
    <p *ngIf="servizio.isLoggedIn()">Benvenuto</p>
</section>

<section>
    <img src="images/logo.svg">
</section>

<section>
    <p>Cerca qualunque cosa tu desideri</p>
</section>

<section>
    <div class="search">
        <input type="text" placeholder="Cerca...">
        <button class="custom_button">Vai!</button>
    </div>
</section>

<section>
  <div class="button-row">
    <button class="custom_button" *ngIf="!servizio.isLoggedIn()" routerLink="/login">Login</button>
    <button class="custom_button" *ngIf="!servizio.isLoggedIn()" routerLink="/register">Registrati</button>

    <button class="custom_button" *ngIf="servizio.isLoggedIn()" (click)="logout()">Logout</button>
    <button class="custom_button" *ngIf="servizio.isLoggedIn()" routerLink="/edit"> Crea</button>

  </div>
</section>
